[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "user-service"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@732256a5207ee502d7bf70cb171cf2eea1803b87",
    "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@e79c5b41d5dbbb8e190ccb59dd0d57bb45ec69ec",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@c3b7b4b65e04de1830f4c24bf00669dca3a97375",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@f252909af772b2c820555af36de456d46f17cfcb",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@9a9bbb20c2e0cd41febf3233ce7a48fe17a84b04",
    "fastapi>=0.135.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
    "starlette>=0.48.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0", "pytest>=8.4.0", "pytest-asyncio>=1.2.0",
    "respx>=0.22.0", "testcontainers>=4.15.0", "cryptography>=45.0.0",
    "spanopticon-tests @ git+https://github.com/hyperme-sh/controlplane-tests.git@78328efbb3c5d788903adc20c7e34e6232053ee2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/examples", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "user-service"
version = "0.24.1"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@c2122d98795452f54d56808d1d94f8b9dffb476f",
    "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@b4b635eb8f0639d34c1b7646357e859ea189bbb8",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@f75718584de811a1ef9fcc9226a67f073577b464",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@6ee52fe3e775548956cada649715fdde80f6cd1d",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@94717d746f9d321dde1a44019c10e31acaee3204",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@c8f01df2b475d92a41977161f8a72e095765481e",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@ae5aa86dc53b1a9e25ae4527fefeea6da6fb66ea",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@c0c4b5a2d9664e73168f968b2d124976b1b01a7a",
    "fastapi>=0.135.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
    "starlette>=0.48.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0", "pytest>=8.4.0", "pytest-asyncio>=1.2.0",
    "respx>=0.22.0", "testcontainers>=4.9.0", "cryptography>=45.0.0",
    "spanopticon-tests @ git+https://github.com/hyperme-sh/controlplane-tests.git@3ddb87b82549951eef219c4ae8798ea344a59c36",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

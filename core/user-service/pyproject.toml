[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-core",
]

[tool.uv.sources]
controlplane-core = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/user_service"]

[tool.hatch.build.targets.sdist]
include = ["src/user_service"]

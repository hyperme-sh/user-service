[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "user-service"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0813448d067d59a0cc8fa2d144d85ddfde465af4",
    "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@455077b61ba595af48253d95075fa88ecbd8c914",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@d5e658e1a139b58718a1dc1a5a532efd63d4f01c",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@907b9390b3d68aa67903ffec849e9f1d64c17f1f",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@c1f37025a93c8b4e38699a42665ce380a66a54fd",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@8f16587d105f7352891a1d9d77ec8305bbf5cd29",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@dd806a74b6ec423be8209e67803106ee47adc23b",
    "fastapi>=0.135.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
    "starlette>=0.48.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0", "pytest>=8.4.0", "pytest-asyncio>=1.2.0",
    "respx>=0.22.0", "testcontainers>=4.15.0", "cryptography>=45.0.0",
    "spanopticon-tests @ git+https://github.com/hyperme-sh/controlplane-tests.git@78328efbb3c5d788903adc20c7e34e6232053ee2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]
# Schema provisioning is an explicit image-local owner bundle.
exclude = ["src/user_service/migrations/**", "src/user_service/migrate.py"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/examples", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operator-ban-store"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
description = "User-service-owned read-only operator ban contract"
dependencies = ["sqlalchemy>=2.0.43"]

[tool.hatch.build.targets.wheel]
packages = ["src/operator_ban_store"]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0", "asyncpg>=0.30.0", "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

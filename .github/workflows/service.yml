name: Standalone service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    concurrency:
      group: user-moving-test-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: service-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Prepare exact owner artifact output
        run: |
          echo "QUALIFICATION_VENV=$(mktemp -d "$RUNNER_TEMP/user-venv.XXXXXX")" >> "$GITHUB_ENV"
          echo "TEST_EVIDENCE_DIR=$(mktemp -d "$RUNNER_TEMP/user-results.XXXXXX")" >> "$GITHUB_ENV"
          output=$(mktemp -d "$RUNNER_TEMP/user-service-dist.XXXXXX")
          echo "SERVICE_ARTIFACT_DIR=$output" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$output" >> "$GITHUB_ENV"
          qualification_parent=$(mktemp -d "$RUNNER_TEMP/user-owner-qualification.XXXXXX")
          echo "OWNER_QUALIFICATION_DIR=$qualification_parent/current" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Validate installed service and standalone container
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:service-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        shell: bash
        run: |
          bash scripts/anonymous-command.sh env UV_PROJECT_ENVIRONMENT="$QUALIFICATION_VENV" UV_PYTHON_INSTALL_DIR="$QUALIFICATION_VENV-python" TEST_DATABASE_URL="$TEST_DATABASE_URL" TEST_EVIDENCE_DIR="$TEST_EVIDENCE_DIR" SERVICE_ARTIFACT_DIR="$SERVICE_ARTIFACT_DIR" bash scripts/check-package.sh
          bash scripts/anonymous-command.sh env TEST_DATABASE_URL="$TEST_DATABASE_URL" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" bash core/user-service/contracts/scripts/check-package.sh
      - name: Qualify public container without dependency credentials
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:service-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          bash scripts/anonymous-command.sh env UV_PROJECT_ENVIRONMENT="$QUALIFICATION_VENV" UV_PYTHON_INSTALL_DIR="$QUALIFICATION_VENV-python" TEST_DATABASE_URL="$TEST_DATABASE_URL" QUALIFIED_IMAGE_REF="user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" bash scripts/check-container.sh
      - name: Bind both validated owner wheels
        run: |
          bash scripts/anonymous-command.sh env UV_PROJECT_ENVIRONMENT="$QUALIFICATION_VENV" UV_PYTHON_INSTALL_DIR="$QUALIFICATION_VENV-python" uv run --project core/user-service --no-sync pytest -q tests_tools
          archive=$(python3 scripts/owner_artifact.py build "$SERVICE_ARTIFACT_DIR")
          qualified="$OWNER_QUALIFICATION_DIR"
          python3 scripts/owner_artifact.py qualify "$archive" "$qualified" "$GITHUB_SHA"
          python3 scripts/verify_release_candidate.py "$qualified/release.json" "$qualified/contract.json" "$qualified/evidence.json" user-service
      - name: Publish the qualified main runtime and record its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/runtime-login.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          local_image="user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config=$(docker image inspect "$local_image" --format '{{.Id}}')
          revision=$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runtime:test-${GITHUB_SHA}"
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then image="$image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Existing candidates cannot silently change on a rerun.
          if docker manifest inspect "$image" > /dev/null 2>manifest.err; then
            echo 'Test image already exists; refusing to replace its content' >&2
            exit 1
          elif [[ "$(cat manifest.err)" != "no such manifest: $image" && "$(cat manifest.err)" != "manifest unknown" ]]; then
            cat manifest.err >&2
            echo 'Registry lookup did not establish an absent manifest; refusing publication' >&2
            exit 1
          fi
          docker tag "$local_image" "$image"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          bash scripts/push-qualified-image.sh "$image"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/runtime"
          ref=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v repo="$repo@" 'index($0,repo)==1')
          [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
          directory="$SERVICE_ARTIFACT_DIR"
          mkdir -p "$directory"
          python3 - "$ref" "$config" "$directory/runtime-image.json" <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[3]).write_text(json.dumps(dict(image=sys.argv[1], image_id=sys.argv[2],
              repository=os.environ['GITHUB_REPOSITORY'], revision=os.environ['GITHUB_SHA'],
              run_id=int(os.environ['GITHUB_RUN_ID'])), sort_keys=True)+'\n')
          PYTHON
      - name: Advance moving TEST from qualified current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'Superseded qualified build retained; moving TEST stays unchanged'
            exit 0
          fi
          local_image="user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config=$(docker image inspect "$local_image" --format '{{.Id}}')
          revision=$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/user-channel-login.XXXXXX")
          channel="ghcr.io/${GITHUB_REPOSITORY,,}/runtime:test"
          trap 'docker image rm "$channel" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$config" "$channel"
          bash scripts/push-qualified-image.sh "$channel"
          docker pull "$channel"
          test "$(docker image inspect "$channel" --format '{{.Id}}')" = "$config"
          test "$(docker image inspect "$channel" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          echo "$channel tracks qualified main $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify flat tested artifact inventory
        run: python3 scripts/owner_artifact.py verify-delivery "$SERVICE_ARTIFACT_DIR"
      - name: Clean up qualification alias
        if: always()
        run: docker image rm "user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
      - name: Remove job-local qualification output
        if: always()
        run: rm -rf -- "$QUALIFICATION_VENV" "$QUALIFICATION_VENV-python" "$SERVICE_ARTIFACT_DIR" "$(dirname "$OWNER_QUALIFICATION_DIR")" "$TEST_EVIDENCE_DIR"

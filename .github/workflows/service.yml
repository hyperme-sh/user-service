name: Standalone service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: service-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    environment: controlplane-libs-read
    steps:
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            auth-service
            controlplane-api
            controlplane-core
            controlplane-db
            controlplane-events
            controlplane-identity
            controlplane-models
            controlplane-tenancy
            controlplane-tests
            user-service
      - name: Prepare exact owner artifact output
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/user-service-dist.XXXXXX")
          echo "SERVICE_ARTIFACT_DIR=$output" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$output" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate installed service and standalone container
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
          TEST_DATABASE_URL: postgresql+psycopg://postgres:service-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN" || { echo 'Private dependency read access is required'; exit 1; }
          chmod 0555 scripts/private-git-credential.py
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=credential.helper GIT_CONFIG_VALUE_1="$PWD/scripts/private-git-credential.py"
          export GIT_CONFIG_KEY_2=credential.useHttpPath GIT_CONFIG_VALUE_2=true
          TEST_EVIDENCE_DIR="$RUNNER_TEMP/user-native-test-results" bash scripts/check-package.sh
          bash core/user-service/contracts/scripts/check-package.sh
      - name: Qualify public container without dependency credentials
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:service-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          unset DEPENDENCY_READ_TOKEN DEPENDENCY_READ_TOKEN_FILE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          QUALIFIED_IMAGE_REF="user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" bash scripts/check-container.sh
      - name: Bind both validated owner wheels
        run: |
          uv run --project core/user-service --frozen pytest -q tests_tools
          archive=$(python3 scripts/owner_artifact.py build "$SERVICE_ARTIFACT_DIR")
          qualified="$SERVICE_ARTIFACT_DIR/qualification"
          python3 scripts/owner_artifact.py qualify "$archive" "$qualified" "$GITHUB_SHA"
          python3 scripts/verify_release_candidate.py "$qualified/release.json" "$qualified/contract.json" "$qualified/evidence.json" user-service
      - name: Publish the qualified main runtime and record its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/runtime-login.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          local_image="user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config=$(docker image inspect "$local_image" --format '{{.Id}}')
          revision=$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runtime:test-${GITHUB_SHA}"
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then image="$image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Existing candidates cannot silently change on a rerun.
          if docker manifest inspect "$image" > /dev/null 2>manifest.err; then
            echo 'Test image already exists; refusing to replace its content' >&2
            exit 1
          elif [[ "$(cat manifest.err)" != "no such manifest: $image" && "$(cat manifest.err)" != "manifest unknown" ]]; then
            cat manifest.err >&2
            echo 'Registry lookup did not establish an absent manifest; refusing publication' >&2
            exit 1
          fi
          docker tag "$local_image" "$image"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          docker push "$image"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/runtime"
          ref=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v repo="$repo@" 'index($0,repo)==1')
          [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
          directory="$SERVICE_ARTIFACT_DIR"
          mkdir -p "$directory"
          python3 - "$ref" "$config" "$directory/runtime-image.json" <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[3]).write_text(json.dumps(dict(image=sys.argv[1], image_id=sys.argv[2],
              repository=os.environ['GITHUB_REPOSITORY'], revision=os.environ['GITHUB_SHA'],
              run_id=int(os.environ['GITHUB_RUN_ID'])), sort_keys=True)+'\n')
          PYTHON
      - name: Retain validated owner artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-dist
          path: ${{ env.SERVICE_ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain native test identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-results
          path: ${{ runner.temp }}/user-native-test-results/*.xml
          if-no-files-found: error
          retention-days: 30
      - name: Clean up qualification alias
        if: always()
        run: docker image rm "user-service:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true

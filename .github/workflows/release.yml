name: Package release channels
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-stable-package-release
  cancel-in-progress: false
jobs:
  release-admission:
    if: github.event_name == 'push'
    uses: hyperme-sh/spanopticon/.github/workflows/component-release.yml@8cc3b2497d83fbee34938d7ad862ffea03d34e6d
    with:
      release-line: '0.24'
      baseline-ref: ${{ vars.SPANOPTICON_RELEASE_BASELINE_SHA }}
      requested-version: ${{ github.ref_name }}
  publish:
    needs: release-admission
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'push' && needs.release-admission.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish exact tested stable artifacts
        uses: hyperme-sh/.github/actions/release-channel@e0a197a6c3bdac180ef2a8a4678a1ebb8997b0f0
        with:
          workflow: .github/workflows/service.yml
          token: ${{ github.token }}
